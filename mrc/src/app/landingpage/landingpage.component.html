<main>

<div class="main-banner"></div>

<div class="quem-somos">

  <article>
    <img src="" alt="quemSomos-img">
    <div class="btns">
      <button><</button>
      <button>></button>
    </div>
  </article>
  
  <aside>
    <h2>Quem Somos</h2>
    <p>{{text.quemSomos}}</p>
  </aside>

</div>

<div class="servicos-carrousel">
  <h2>Nossos Serviços</h2>
  <div class="card-group gap-3">
    <app-servico-card
      [titulo]="'Obras'"
      [cardContent]="text.serviceCard.obra"
      [cardImgUrl]="'./.././../assets/servico1.png'"
    ></app-servico-card>
    <app-servico-card
      [titulo]="'Reformas'"
      [cardContent]="text.serviceCard.reforma"
      [cardImgUrl]="'./.././../assets/servico2.png'"
    ></app-servico-card>
    <app-servico-card
      [titulo]="'Consultoria'"
      [cardContent]="text.serviceCard.consultoria"
      [cardImgUrl]="'./.././../assets/servico3.png'"
    ></app-servico-card>
    <app-servico-card
      [titulo]="'Projetos'"
      [cardContent]="text.serviceCard.projetos"
      [cardImgUrl]="'./.././../assets/servico4.png'"
    ></app-servico-card>
  </div>
   <div class="btns">
      <button><</button>
      <button>></button>
    </div>
</div>





<div class="fl container-fluid d-grid  p-0" style="overflow: hidden;">
<div class="row">
<div id="carouselExampleIndicators" class="carousel slide col-12 col-md-6"  data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img class="d-block w-100 img-fluid img-h" src="assets/proj1.png" alt="First slide">
      </div>
      <div class="carousel-item">
        <img class="d-block w-100 img-fluid img-h" src="assets/proj2.png" alt="Second slide">
      </div>
      <div class="carousel-item">
        <img class="d-block w-100 img-fluid img-h" src="assets/proj3.png" alt="Third slide">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <aside class="col-12 col-md-6" style="max-width: fit-content;">
  <div class="p-4 pt-0 lh-m" style="height: 100%;">
    <h2 class="row mb-4 mt-5">Nossos Projetos</h2>
    <p class="row mb-4" >{{text.projetosText}}</p>
    <p class="row mb-5" >{{text.projetosText2}}</p>
    <button class="row btn btn-dark" style="width: 150px; font-size: 20px;"  >Ver Projetos</button>
  </div>
    </aside>
</div>
  
</div>




<div style="height: 300px;" class="d-flex align-items-center justify-content-md-center container mt-3 mb-3">
  
  <div style="max-width: 100vw;" class="fl d-grid gap-0 w-100 h-100 align-items-center align-middle justify-content-md-center text-center" >
    <div class="row">
    <h1>ENTRE EM CONTATO AGORA MESMO</h1>
    </div>
  
    <div class="row">
    <p style="max-width: 800px;">Entre em contato conosco para tirar dúvidas e obter mais informações. Solicite um orçamento sem compromisso e descubra como podemos ajudar!</p>
    </div>
  
    <div class="row d-flex justify-content-center"> 
      <button style="min-width: 250px; font-size: 20px"  class="btn btn-dark w-50">
      <i class="bi bi-whatsapp"></i>
      <span>Solicite um Orçamento</span>
      </button>
    </div>
  </div>
  
</div>

</main>
