<main style="padding-top: 76px;">

  <div class="main-banner"></div>
    <div class="fl container-fluid d-grid p-0" style="overflow: hidden;">
      <div class="row">
      <div class="col-12 col-lg-6">
        <img class="d-block img-fluid" style="max-height: 512px; object-fit: fill; border-bottom-right-radius: 50px;" src="assets/quemSomos.png" alt="First slide">
      </div>
        
      <aside class="col-12 col-lg-6" style="max-width: fit-content;">
        <div class="p-4 ps-lg-4 ps-sm-5 pt-0 lh-m" style="max-height: 100%;">
          <h2 class="row ms-0 mb-4 mt-5">Quem Somos</h2>
          <div class="row  mb-4" style="max-width: 520px;" [innerHTML]="text.quemSomos"></div>
        </div>
      </aside>
      </div>
  </div>



  <div class="servicos-carrousel pb-5" style="background-color: rgba(245, 245, 245, 1);">
    <h2 class="ps-5 pt-5">Nossos Serviços</h2>

    <ng-container *ngIf="!mobileCheck()">
      <div class="fl card-group gap-5 justify-content-center">
        <app-servico-card [titulo]="'Obras'" [cardContent]="text.serviceCard.obra"
          [cardImgUrl]="'./.././../assets/servico1.png'"></app-servico-card>
        <app-servico-card [titulo]="'Reformas'" [cardContent]="text.serviceCard.reforma"
          [cardImgUrl]="'./.././../assets/servico2.png'"></app-servico-card>
        <app-servico-card [titulo]="'Consultoria'" [cardContent]="text.serviceCard.consultoria"
          [cardImgUrl]="'./.././../assets/servico3.png'"></app-servico-card>
        <app-servico-card [titulo]="'Acompanhamento'" [cardContent]="text.serviceCard.projetos"
          [cardImgUrl]="'./.././../assets/servico4.png'"></app-servico-card>
      </div>
    </ng-container>

    <ng-container *ngIf="mobileCheck()">
      <!-- Bootstrap Carousel -->
      <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
        <div class="fl gap-0 carousel-inner">
          <div class="carousel-item active">
            <app-servico-card class="d-flex justify-content-center" [titulo]="'Obras'"
              [cardContent]="text.serviceCard.obra" [cardImgUrl]="'./.././../assets/servico1.png'">
            </app-servico-card>
          </div>
          <div class="carousel-item">
            <app-servico-card class="d-flex justify-content-center" [titulo]="'Reformas'"
              [cardContent]="text.serviceCard.reforma" [cardImgUrl]="'./.././../assets/servico2.png'">
            </app-servico-card>
          </div>
          <div class="carousel-item">
            <app-servico-card class="d-flex justify-content-center" [titulo]="'Consultoria'"
              [cardContent]="text.serviceCard.consultoria" [cardImgUrl]="'./.././../assets/servico3.png'">
            </app-servico-card>
          </div>
          <div class="carousel-item">
            <app-servico-card class="d-flex justify-content-center" [titulo]="'Projetos'"
              [cardContent]="text.serviceCard.projetos" [cardImgUrl]="'./.././../assets/servico4.png'">
            </app-servico-card>
          </div>
        </div>
        <!-- Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
          <div class="btn-div">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </div>
        </button>



        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
          <div class="btn-div">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </div>
        </button>


      </div>

    </ng-container>

  </div>





  <div class="fl container-fluid d-grid  p-0" style="overflow: hidden;">
    <div class="row">

      <div id="carouselExampleIndicators" class="carousel slide col-12 col-lg-6" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
            class="active"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
          <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="d-block w-100 img-fluid h-100" style="border-bottom-right-radius: 50px;" src="assets/proj1.png" alt="First slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100 img-fluid h-100" style="border-bottom-right-radius: 50px;" src="assets/proj2.png" alt="Second slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100 img-fluid h-100" style="border-bottom-right-radius: 50px;"src="assets/proj3.png" alt="Third slide">
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6" style="max-width: fit-content;">
        <div class="p-4 ps-lg-4 ps-sm-5 pt-0 lh-m" style="height: 100%;">
          <h2 class="row mb-4 mt-5">Nossos Projetos</h2>
          <p class="row mb-4" style="max-width: 520px;" [innerHTML]="text.projetosText"></p>
          <p class="row mb-4" style="max-width: 520px;" [innerHTML]="text.projetosText2"></p>
          <div class="btn-center row">
            <button class="btn btn-dark" style="width: 150px; font-size: 20px; border-radius: 50px;">Ver
              Projetos</button>
          </div>
        </div>
      </div>

    </div>

  </div>




  <div style="height: 300px;" class="d-flex align-items-center justify-content-md-center container mt-3 mb-3">

    <div style="max-width: 100vw;"
      class="fl d-grid gap-0 w-100 h-100 align-items-center align-middle justify-content-md-center text-center">
      <div class="row">
        <h1 class="fw-bold">ENTRE EM CONTATO AGORA MESMO</h1>
      </div>

      <div class="row">
        <p style="max-width: 800px;">Entre em contato conosco para tirar dúvidas e obter mais informações. Solicite um
          orçamento sem compromisso e descubra como podemos ajudar!</p>
      </div>

      <div class="row d-flex justify-content-center">
        <button style="min-width: fit-content; font-size: 20px; border-radius: 50px;" class="btn btn-dark w-50">
          <i class="bi bi-whatsapp"></i>
          <span>Solicite um Orçamento</span>
        </button>
      </div>
    </div>

  </div>

</main>
